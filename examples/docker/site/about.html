    <h1>About</h1>
    <p>
      Three containers: <b>prosody</b> (the XMPP server), <b>origin</b> (nginx
      serving these files), and <b>gateway</b> (xmpp-httpx-gateway, which owns
      the component <code>web.localhost</code>).
    </p>
    <p>The origin is not published to the host — only the gateway can reach it.</p>
