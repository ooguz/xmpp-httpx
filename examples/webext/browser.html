<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>httpx browser</title>
    <!-- Swapped for the page's own icon (fetched over httpx) while browsing. -->
    <link
      id="favicon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a56db'/%3E%3Ctext x='8' y='12.5' font-family='monospace' font-size='12' fill='white' text-anchor='middle'%3Ex%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Tab labels are page titles; the strip is built with textContent in JS. -->
    <nav id="tabstrip">
      <ul id="tabs"></ul>
      <button id="newTab" title="New tab" aria-label="New tab">+</button>
    </nav>

    <header id="chrome">
      <button id="back" title="Back" aria-label="Back">←</button>
      <button id="forward" title="Forward" aria-label="Forward">→</button>
      <button id="reload" title="Reload" aria-label="Reload">⟳</button>
      <form id="nav">
        <input
          id="address"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="httpx://webserver@example.org/index.html"
        />
      </form>
      <button id="bookmark" title="Bookmark this page" aria-label="Bookmark" aria-pressed="false">
        ☆
      </button>
      <button id="drawerBtn" title="History and bookmarks" aria-label="History" aria-expanded="false">
        ☰
      </button>
      <span id="progressBytes" class="chip" hidden></span>
      <span id="cacheState" class="chip" hidden></span>
      <span id="status" class="chip" data-state="disconnected" title="XMPP connection">offline</span>
      <button id="settingsBtn" title="Connection settings" aria-label="Settings">⚙</button>
    </header>

    <!-- Byte progress of the active tab's load. Outside #chrome on purpose:
         embedded mode hides the chrome, and the host app has no window onto
         this page's transfers — the bar is the one loading signal it gets. -->
    <progress id="loadProgress" hidden></progress>

    <dialog id="settings">
      <form method="dialog" id="settingsForm">
        <h2>XMPP connection</h2>
        <label>
          WebSocket service
          <input id="service" type="text" placeholder="wss://example.org/xmpp-websocket" required />
        </label>
        <label>
          JID
          <input id="jid" type="text" placeholder="alice@example.org" required />
        </label>
        <label>
          Password
          <input id="password" type="password" />
        </label>
        <label>
          Exit JID (optional)
          <input id="exit" type="text" placeholder="exit.example.org" />
          <small>Set this to browse the ordinary web (http/https) through an n146 exit.</small>
        </label>
        <p class="warning">
          Demo-grade: credentials are kept in extension storage in plaintext.
        </p>
        <menu>
          <button value="cache" id="clearCache" type="button">Clear cache</button>
          <button value="cancel">Cancel</button>
          <button value="connect" id="connectBtn">Save &amp; connect</button>
        </menu>
      </form>
    </dialog>

    <main>
      <!-- One sandboxed iframe per tab, created in app.ts; only the active one
           is visible, so switching tabs never refetches a page. -->
      <div id="viewports"></div>

      <!-- Entries are built with textContent: page titles are hostile input. -->
      <aside id="drawer" hidden aria-label="History and bookmarks">
        <header>
          <div id="drawerTabs" role="tablist">
            <button id="tabHistory" role="tab" aria-selected="true" data-panel="history">
              History
            </button>
            <button id="tabBookmarks" role="tab" aria-selected="false" data-panel="bookmarks">
              Bookmarks
            </button>
          </div>
          <button id="drawerClear" title="Clear history">Clear</button>
          <button id="drawerClose" title="Close" aria-label="Close drawer">✕</button>
        </header>
        <ul id="drawerList"></ul>
        <p id="drawerEmpty" hidden>Nothing here yet.</p>
      </aside>
    </main>

    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
