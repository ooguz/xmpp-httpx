<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>httpx browser</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="chrome">
      <button id="back" title="Back" aria-label="Back">←</button>
      <button id="forward" title="Forward" aria-label="Forward">→</button>
      <button id="reload" title="Reload" aria-label="Reload">⟳</button>
      <form id="nav">
        <input
          id="address"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="httpx://webserver@example.org/index.html"
        />
      </form>
      <span id="status" data-state="disconnected" title="XMPP connection">offline</span>
      <button id="settingsBtn" title="Connection settings" aria-label="Settings">⚙</button>
    </header>

    <dialog id="settings">
      <form method="dialog" id="settingsForm">
        <h2>XMPP connection</h2>
        <label>
          WebSocket service
          <input id="service" type="text" placeholder="wss://example.org/xmpp-websocket" required />
        </label>
        <label>
          JID
          <input id="jid" type="text" placeholder="alice@example.org" required />
        </label>
        <label>
          Password
          <input id="password" type="password" />
        </label>
        <p class="warning">
          Demo-grade: credentials are kept in extension storage in plaintext.
        </p>
        <menu>
          <button value="cancel">Cancel</button>
          <button value="connect" id="connectBtn">Save &amp; connect</button>
        </menu>
      </form>
    </dialog>

    <main>
      <iframe id="viewport" sandbox="allow-same-origin" title="page content"></iframe>
    </main>

    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
